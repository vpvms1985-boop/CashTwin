<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FFFDF9]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CashTwin - See Cash-Flow Crisis Before It Happens{% endblock %}</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#F97316',      // Primary Orange
                        'primary-dark': '#C2410C', // Dark Orange
                        accent: '#F59E0B',       // Accent Amber
                        background: '#FFFDF9',   // Background Cream
                        surface: '#FFFFFF',      // Surface White
                        'text-primary': '#1F2937', // Primary Text Gray
                        'text-secondary': '#6B7280', // Secondary Text Gray
                        border: '#E5E7EB',       // Border Gray
                        healthy: '#16A34A',      // Green
                        attention: '#D97706',    // Amber
                        critical: '#DC2626',     // Red
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar and minor tweaks */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #FFFDF9;
        }

        ::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #D1D5DB;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="h-full text-text-primary antialiased selection:bg-primary/20 selection:text-primary-dark">
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>

</html>
